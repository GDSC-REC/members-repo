<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./icons/googleLogo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <title>GDSC REC Members Repo</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="main-title">
          <span class="google-blue">G</span><span class="google-red">D</span><span class="google-yellow">S</span><span class="google-green">C</span>
          <span class="subtitle">REC Members</span>
        </h1>
        <p class="description">Meet our amazing Google Developer Student Club community!</p>
      </div>
    </header>
    
    <main class="main-content">
      <div class="container">
        <div id="members-grid" class="members-grid">
          <div class="card">
            <div class="card-header">
              <div class="avatar google-blue">CN</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; <span id="current-year">2025</span> GDSC Raghu Engineering College. Built with ❤️ by our community</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
